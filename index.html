<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Wi-Fi Cloud</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-grad: linear-gradient(135deg, #4f46e5, #3b82f6);
            --bg-color: #f3f4f6;
            --surface: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,0.03) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(225,39%,30%,0.03) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(339,49%,30%,0.03) 0, transparent 50%);
            color: var(--text-main);
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 1.75rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 1rem;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .cloud-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #dcfce7;
            color: #166534;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .cloud-status.offline {
            background: #fef08a;
            color: #854d0e;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            background-color: #f9fafb;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .result-box {
            background: var(--primary-grad);
            padding: 1.25rem;
            border-radius: var(--radius-md);
            text-align: center;
            margin: 1.5rem 0;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .result-box span {
            display: block;
            font-size: 0.85rem;
            opacity: 0.9;
            margin-bottom: 0.25rem;
        }

        .result-box strong {
            font-size: 2rem;
            font-weight: 700;
        }

        button.btn-submit {
            width: 100%;
            background: var(--text-main);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        button.btn-submit:hover { background: #1f2937; }
        button.btn-submit:active { transform: scale(0.98); }

        /* Riwayat Styling */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }
        
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .day-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .day-header {
            background: #f8fafc;
            padding: 0.75rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .day-header .date {
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .day-header .vcr-count {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .day-header .day-total {
            font-weight: 700;
            color: var(--primary);
        }

        .trx-list { padding: 0.5rem 1.25rem; }

        .trx-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px dashed var(--border);
        }
        
        .trx-item:last-child { border-bottom: none; }

        .trx-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e0e7ff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .trx-name { font-weight: 600; font-size: 0.9rem; }
        .trx-qty { color: var(--text-muted); font-size: 0.75rem; display: block; }
        .trx-action { display: flex; align-items: center; gap: 12px; }
        .trx-price { font-weight: 600; font-size: 0.9rem; }

        .btn-del-sm {
            background: var(--danger-bg);
            color: var(--danger);
            border: none;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .btn-del-sm:hover { background: var(--danger); color: white; }

        .total-all {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: var(--text-main);
            color: white;
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Input Kasir -->
        <div class="card">
            <div class="header">
                <h1>Kasir Wi-Fi</h1>
                <div id="status-cloud" class="cloud-status offline">Memuat Database...</div>
            </div>

            <div class="form-group">
                <label>Tanggal Transaksi</label>
                <input type="date" id="tanggal">
            </div>

            <div class="form-group">
                <label>Nama Pelanggan</label>
                <input type="text" id="nama" placeholder="Contoh: Budi" autocomplete="off" autofocus>
            </div>

            <div class="form-group">
                <label>Jumlah Voucher</label>
                <input type="number" id="jumlah" placeholder="1" min="1" value="1">
            </div>

            <div class="result-box">
                <span>Tarif: Rp 3.000 / Voucher</span>
                <strong id="total-preview">Rp 3.000</strong>
            </div>

            <button class="btn-submit" id="btn-catat">Catat Penjualan</button>
        </div>

        <!-- Riwayat Cloud -->
        <div class="card">
            <div class="history-header">
                <h3>Riwayat Penjualan (Cloud)</h3>
            </div>
            
            <div class="history-list" id="daftar-riwayat">
                <!-- Data dari Firebase akan muncul di sini otomatis -->
            </div>

            <div class="total-all">
                <span>Total Seluruh Waktu</span>
                <strong id="total-semua">Rp 0</strong>
            </div>
        </div>
    </div>

    <!-- Import SDK Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==========================================
        // GANTI BAGIAN INI DENGAN FIREBASE CONFIG MU
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSy_GANTI_KODE_INI_DENGAN_MILIKMU",
            authDomain: "smart-relay-esp32-XXX.firebaseapp.com",
            databaseURL: "https://smart-relay-esp32-XXX.firebaseio.com",
            projectId: "smart-relay-esp32",
            storageBucket: "smart-relay-esp32-XXX.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456:web:12345"
        };
        // ==========================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Buat "kamar" khusus untuk aplikasi kasir di dalam Firebase
        const dbRef = ref(db, 'KasirWiFi/Penjualan');

        const HARGA = 3000;
        const inputTanggal = document.getElementById('tanggal');
        const inputNama = document.getElementById('nama');
        const inputJumlah = document.getElementById('jumlah');
        const previewTotal = document.getElementById('total-preview');
        const daftarRiwayat = document.getElementById('daftar-riwayat');
        const tampilTotalSemua = document.getElementById('total-semua');
        const btnCatat = document.getElementById('btn-catat');
        const statusCloud = document.getElementById('status-cloud');

        // Set tanggal hari ini
        const today = new Date();
        const tglHariIni = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        inputTanggal.value = tglHariIni;

        // Formatter Uang & Tanggal
        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        const formatTanggalTampil = (tglStr) => new Date(tglStr).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const getInisial = (nama) => nama.charAt(0).toUpperCase();

        // Hitung total real-time saat ngetik
        inputJumlah.addEventListener('input', (e) => {
            const jumlah = parseInt(e.target.value) || 0;
            previewTotal.textContent = formatRupiah(jumlah * HARGA);
        });

        // Simpan Data ke Firebase
        const simpanData = () => {
            const tanggal = inputTanggal.value;
            const nama = inputNama.value.trim() || 'Hamba Allah'; 
            const jumlahInput = parseInt(inputJumlah.value) || 0;

            if (!tanggal || jumlahInput <= 0) {
                alert("Jumlah voucher minimal 1.");
                return;
            }

            // Path penyimpanan: KasirWiFi/Penjualan/2026-09-21/id_unik
            const hariRef = ref(db, `KasirWiFi/Penjualan/${tanggal}`);
            const dataBaruRef = push(hariRef); // Buat ID unik acak
            
            set(dataBaruRef, {
                nama: nama,
                jumlah: jumlahInput,
                totalBayar: jumlahInput * HARGA,
                waktu: Date.now() // Untuk mengurutkan data
            });

            // Reset UI
            inputNama.value = '';
            inputJumlah.value = '1';
            previewTotal.textContent = formatRupiah(HARGA);
            inputNama.focus();
        };

        btnCatat.addEventListener('click', simpanData);
        inputNama.addEventListener("keypress", (e) => { if (e.key === "Enter") simpanData(); });
        inputJumlah.addEventListener("keypress", (e) => { if (e.key === "Enter") simpanData(); });

        // Fungsi Hapus Data (Harus didaftarkan ke window agar bisa dipanggil dari HTML yang di-generate)
        window.hapusTransaksi = (tanggal, idUnik) => {
            if(confirm("Yakin hapus pelanggan ini?")) {
                remove(ref(db, `KasirWiFi/Penjualan/${tanggal}/${idUnik}`));
            }
        };

        // Membaca Data dari Firebase (Otomatis terupdate setiap ada perubahan)
        onValue(dbRef, (snapshot) => {
            statusCloud.textContent = "🟢 Terhubung & Tersimpan";
            statusCloud.classList.remove('offline');
            daftarRiwayat.innerHTML = '';
            
            const dataPenjualan = snapshot.val();
            let totalSemuaWaktu = 0;

            if (!dataPenjualan) {
                daftarRiwayat.innerHTML = '<div style="text-align:center; padding: 2rem 0; color:var(--text-muted);"><p>Belum ada catatan penjualan di Cloud</p></div>';
                tampilTotalSemua.textContent = 'Rp 0';
                return;
            }

            // Urutkan tanggal dari yang terbaru (Z-A)
            const arrayTanggal = Object.keys(dataPenjualan).sort((a, b) => b.localeCompare(a));

            arrayTanggal.forEach(tgl => {
                const transaksiHariIni = dataPenjualan[tgl];
                let totalUangHariIni = 0;
                let totalVoucherHariIni = 0;
                
                // Ubah objek transaksi ke array dan urutkan berdasarkan waktu input terbaru
                const arrTrx = Object.keys(transaksiHariIni).map(key => {
                    return { id: key, ...transaksiHariIni[key] };
                }).sort((a, b) => b.waktu - a.waktu);

                let listHtml = '';
                arrTrx.forEach(trx => {
                    totalUangHariIni += trx.totalBayar;
                    totalVoucherHariIni += trx.jumlah;
                    totalSemuaWaktu += trx.totalBayar;

                    listHtml += `
                        <div class="trx-item">
                            <div class="trx-info">
                                <div class="avatar">${getInisial(trx.nama)}</div>
                                <div>
                                    <span class="trx-name">${trx.nama}</span>
                                    <span class="trx-qty">${trx.jumlah} Voucher</span>
                                </div>
                            </div>
                            <div class="trx-action">
                                <span class="trx-price">${formatRupiah(trx.totalBayar)}</span>
                                <button class="btn-del-sm" onclick="hapusTransaksi('${tgl}', '${trx.id}')" title="Hapus">×</button>
                            </div>
                        </div>
                    `;
                });

                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';
                dayCard.innerHTML = `
                    <div class="day-header">
                        <div>
                            <div class="date">${formatTanggalTampil(tgl)}</div>
                            <div class="vcr-count">Total ${totalVoucherHariIni} Voucher</div>
                        </div>
                        <div class="day-total">${formatRupiah(totalUangHariIni)}</div>
                    </div>
                    <div class="trx-list">
                        ${listHtml}
                    </div>
                `;
                
                daftarRiwayat.appendChild(dayCard);
            });

            tampilTotalSemua.textContent = formatRupiah(totalSemuaWaktu);
        }, (error) => {
            statusCloud.textContent = "🔴 Terputus dari Cloud";
            statusCloud.classList.add('offline');
            console.error(error);
        });

    </script>
</body>
</html>
